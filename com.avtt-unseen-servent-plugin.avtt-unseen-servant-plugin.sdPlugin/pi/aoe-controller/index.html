<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AOE Controller</title>

<style>
body{
margin:0;
padding:16px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
font-size:13px;
color:#d8d8d8;
}

.field{
display:grid;
grid-template-columns:120px 1fr;
gap:12px;
align-items:center;
margin-bottom:12px;
}

label{
text-align:right;
color:#bdbdbd;
}

select,input{
width:100%;
box-sizing:border-box;
background:#3a3a3a;
color:white;
border:1px solid #555;
border-radius:4px;
padding:6px 8px;
}
</style>
</head>

<body>

<div class="field">
<label>Style</label>
<select id="style">
<option value="default">Default</option>
<option value="acid">Acid</option>
<option value="bludgeoning">Bludgeoning</option>
<option value="cold">Cold</option>
<option value="darkness">Darkness</option>
<option value="fire">Fire</option>
<option value="force">Force</option>
<option value="lightning">Lightning</option>
<option value="nature">Nature</option>
<option value="necrotic">Necrotic</option>
<option value="piercing">Piercing</option>
<option value="poison">Poison</option>
<option value="psychic">Psychic</option>
<option value="radiant">Radiant</option>
<option value="slashing">Slashing</option>
<option value="thunder">Thunder</option>
<option value="water">Water</option>
<option value="__custom__">Custom&hellip;</option>
</select>
</div>

<div class="field" id="customStyleField" style="display:none;">
<label>Custom Style</label>
<input id="customStyle" type="text" placeholder="e.g. holy, web, whirlwind">
</div>

<div class="field">
<label>Shape</label>
<select id="shape">
<option value="circle">Circle</option>
<option value="square">Square</option>
<option value="cone">Cone</option>
<option value="line">Line</option>
</select>
</div>

<div class="field">
<label>Size (ft)</label>
<input id="size" type="number" min="5" step="5" value="20">
</div>

<div class="field">
<label>Line Width (ft)</label>
<input id="lineWidth" type="number" min="5" step="5" value="5">
</div>

<div class="field">
<label for="promptForStyle">
Prompt for Style
</label>

<input
id="promptForStyle"
type="checkbox"
>
</div>

<div class="field">
<label for="promptForShape">
Prompt for Shape
</label>

<input
id="promptForShape"
type="checkbox"
>
</div>

<div class="field">
<label for="promptForSize">
Prompt for Size
</label>

<input
id="promptForSize"
type="checkbox"
>
</div>

<div class="field">
<label for="promptForLineWidth">
Prompt for Line Width
</label>

<input
id="promptForLineWidth"
type="checkbox"
>
</div>

<script>
let websocket=null;
let uuid=null;

const style=document.getElementById("style");
const customStyleField=document.getElementById("customStyleField");
const customStyle=document.getElementById("customStyle");
const shape=document.getElementById("shape");
const size=document.getElementById("size");
const lineWidth=document.getElementById("lineWidth");
const promptForStyle=document.getElementById("promptForStyle");
const promptForShape=document.getElementById("promptForShape");
const promptForSize=document.getElementById("promptForSize");
const promptForLineWidth=document.getElementById("promptForLineWidth");

const knownStyleValues=Array.from(style.options)
.map(option=>option.value)
.filter(value=>value!=="__custom__");

function updateCustomStyleVisibility(){
customStyleField.style.display=
style.value==="__custom__" ? "" : "none";
}

function resolveStyleValue(){
return style.value==="__custom__"
? customStyle.value.trim()
: style.value;
}

function save(){
if(!websocket||!uuid)return;

websocket.send(JSON.stringify({
event:"setSettings",
context:uuid,
payload:{
style:resolveStyleValue(),
shape:shape.value,
size:Number(size.value),
lineWidth:Number(lineWidth.value),
promptForStyle:promptForStyle.checked,
promptForShape:promptForShape.checked,
promptForSize:promptForSize.checked,
promptForLineWidth:promptForLineWidth.checked
}
}));
}

window.connectElgatoStreamDeckSocket=function(
port,
context,
registerEvent,
info,
actionInfo
){
uuid=context;

websocket=new WebSocket("ws://127.0.0.1:"+port);

websocket.onopen=()=>{
websocket.send(JSON.stringify({
event:registerEvent,
uuid
}));

const settings=JSON.parse(actionInfo).payload?.settings||{};
const savedStyle=settings.style||"default";

if(knownStyleValues.includes(savedStyle)){
style.value=savedStyle;
customStyle.value="";
}else{
style.value="__custom__";
customStyle.value=savedStyle;
}
updateCustomStyleVisibility();

shape.value=settings.shape||"circle";
size.value=settings.size??20;
lineWidth.value=settings.lineWidth??5;
promptForStyle.checked=settings.promptForStyle===true;
promptForShape.checked=settings.promptForShape===true;
promptForSize.checked=settings.promptForSize===true;
promptForLineWidth.checked=settings.promptForLineWidth===true;
};
};

style.onchange=()=>{
updateCustomStyleVisibility();
save();
};
customStyle.oninput=save;
shape.onchange=save;
size.oninput=save;
lineWidth.oninput=save;
promptForStyle.onchange=save;
promptForShape.onchange=save;
promptForSize.onchange=save;
promptForLineWidth.onchange=save;
</script>

</body>
</html>
