<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Token Status</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      color: #d8d8d8;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .field {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      color: #bdbdbd;
      text-align: right;
    }

    select,
    input {
      width: 100%;
      box-sizing: border-box;
      background: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
    }

    input::placeholder {
      color: #888;
    }

    .hint {
      margin-left: 132px;
      color: #8f8f8f;
      font-size: 11px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="field">
    <label for="condition">Status</label>
    <select id="condition">
      <optgroup label="Conditions">
        <option value="Blinded">Blinded</option>
        <option value="Charmed">Charmed</option>
        <option value="Deafened">Deafened</option>
        <option value="Exhaustion">Exhaustion</option>
        <option value="Frightened">Frightened</option>
        <option value="Grappled">Grappled</option>
        <option value="Incapacitated">Incapacitated</option>
        <option value="Invisible">Invisible</option>
        <option value="Paralyzed">Paralyzed</option>
        <option value="Petrified">Petrified</option>
        <option value="Poisoned">Poisoned</option>
        <option value="Prone" selected>Prone</option>
        <option value="Restrained">Restrained</option>
        <option value="Stunned">Stunned</option>
        <option value="Unconscious">Unconscious</option>
      </optgroup>

      <optgroup label="AboveVTT Statuses">
        <option value="Concentration(Reminder)">Concentration(Reminder)</option>
        <option value="Reaction Used">Reaction Used</option>
        <option value="Flying">Flying</option>
        <option value="Burning">Burning</option>
        <option value="Rage">Rage</option>
        <option value="Blessed">Blessed</option>
        <option value="Baned">Baned</option>
        <option value="Bloodied">Bloodied</option>
        <option value="Advantage">Advantage</option>
        <option value="Disadvantage">Disadvantage</option>
        <option value="Bardic Inspiration">Bardic Inspiration</option>
        <option value="Hasted">Hasted</option>
      </optgroup>

      <optgroup label="Custom">
        <option value="__custom__">Custom...</option>
      </optgroup>
    </select>
  </div>

  <div id="customRow" class="field hidden">
    <label for="customCondition">Custom Name</label>
    <input id="customCondition" type="text" placeholder="Hexed, Hunter's Mark, Phase 2..." />
  </div>

  <div class="field">
    <label for="label">Button Label</label>
    <input id="label" type="text" placeholder="Optional" />
  </div>

  <div class="hint">
    Leave Button Label blank to use the status name. Custom SVG icons go in <code>imgs/conditions</code>.
  </div>

  <script src="index.js"></script>
</body>
</html>
