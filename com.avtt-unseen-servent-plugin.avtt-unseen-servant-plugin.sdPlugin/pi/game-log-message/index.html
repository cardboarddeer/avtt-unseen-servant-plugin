<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Game Log Message</title>
  <script src="index.js"></script>
  <style>
    body { font-family: sans-serif; padding: 12px; color: white; background: #2d2d2d; }
    label { display:block; margin-top:12px; font-size:12px; opacity:.85; }
    input, textarea { width:100%; box-sizing:border-box; margin-top:4px; padding:6px; }
    textarea { min-height:120px; resize: vertical; }
    .hint { font-size:11px; opacity:.65; margin-top:6px; line-height:1.35; }
  </style>
</head>
<body>
  <label>Title</label>
  <input id="title" value="Lair Action" />

  <label>Message</label>
  <textarea id="text">The room begins to shake.</textarea>

  <div class="hint">
    Placeholders supported later: {name}, {hp}, {maxHp}, {ac}, {str}, {dex}, {stealth}, etc.
  </div>
</body>
</html>
