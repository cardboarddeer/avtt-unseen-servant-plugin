<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PC Roll Buff</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      color: #d8d8d8;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .field {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      color: #bdbdbd;
      text-align: right;
    }

    select,
    input,
    button {
      width: 100%;
      box-sizing: border-box;
      background: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #484848;
    }

    button:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .hint {
      margin-left: 132px;
      color: #8f8f8f;
      font-size: 11px;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .status {
      margin-left: 132px;
      color: #a8a8a8;
      font-size: 11px;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .error {
      color: #ff9999;
    }

    .success {
      color: #9fdb9f;
    }

    .search-results {
      margin: -4px 0 12px 132px;
      max-height: 230px;
      overflow-y: auto;
      border: 1px solid #555;
      border-radius: 4px;
      background: #292929;
    }

    .search-result {
      padding: 8px 10px;
      border-bottom: 1px solid #444;
      cursor: pointer;
    }

    .search-result:last-child {
      border-bottom: 0;
    }

    .search-result:hover,
    .search-result.active {
      background: #444;
    }

    .result-name {
      color: #fff;
      font-size: 13px;
    }

    .result-category {
      margin-top: 2px;
      color: #999;
      font-size: 11px;
    }

    .selected-card {
      margin: 0 0 12px 132px;
      padding: 9px 10px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #333;
    }

    .selected-name {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .selected-category {
      margin-top: 3px;
      color: #999;
      font-size: 11px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="field">
    <label for="refreshCatalog">Catalog</label>

    <button id="refreshCatalog" type="button">
      Refresh from AboveVTT
    </button>
  </div>

  <div id="catalogStatus" class="status">
    Loading saved catalog...
  </div>

  <div class="field">
    <label for="buffSearch">Search</label>

    <input
      id="buffSearch"
      type="search"
      placeholder="Bless, Rage, Guidance..."
      autocomplete="off"
    />
  </div>

  <div id="searchResults" class="search-results hidden"></div>

  <div id="selectedBuffCard" class="selected-card hidden">
    <div id="selectedBuffLabel" class="selected-name"></div>
    <div id="selectedBuffCategory" class="selected-category"></div>
  </div>

  <div id="valueRow" class="field hidden">
    <label for="value">Value</label>

    <select id="value">
      <option value="0">
        Disabled
      </option>
    </select>
  </div>

  <div id="enabledRow" class="field hidden">
    <label for="enabled">Enabled</label>

    <input
      id="enabled"
      type="checkbox"
      checked
    />
  </div>

  <div class="field">
    <label for="label">Button Label</label>

    <input
      id="label"
      type="text"
      placeholder="Optional"
    />
  </div>

  <div class="hint">
    Open a PC character sheet in AboveVTT before refreshing the catalog.
    After refreshing, applying a saved buff does not require the sheet to remain open.
  </div>

  <script src="index.js"></script>
</body>
</html>
