<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Player Tracker</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      color: #d8d8d8;
      background: transparent;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 13px;
    }

    .field {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      color: #bdbdbd;
      text-align: right;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      background: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
    }

    .hint {
      margin-left: 132px;
      color: #8f8f8f;
      font-size: 11px;
      line-height: 1.3;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="field">
    <label for="pcName">PC Name</label>

    <input
      id="pcName"
      type="text"
      placeholder="Ayla Dareth"
    />
  </div>

  <div class="field">
    <label for="page">Display Page</label>

    <select id="page">
      <option value="combat">
        Combat / Death Saves
      </option>

      <option value="reference">
        Character Reference
      </option>

      <option value="abilities">
        Ability Modifiers
      </option>
    </select>
  </div>

  <div class="field">
    <label for="refreshSeconds">Refresh</label>

    <input
      id="refreshSeconds"
      type="number"
      min="0.25"
      step="0.25"
      value="1"
    />
  </div>

  <div class="hint">
    Press the Stream Deck key to select and center this PC token.
  </div>

  <div class="hint">
    Leave PC Name blank to display the currently selected token. Selecting or centering requires a PC Name.
  </div>

  <script src="index.js"></script>
</body>
</html>
