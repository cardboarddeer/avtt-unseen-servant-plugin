<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Token HP Modifier</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      color: #d8d8d8;
      background: transparent;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 13px;
    }

    .field {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      color: #bdbdbd;
      text-align: right;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      background: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
    }

    .hint {
      margin-left: 132px;
      color: #8f8f8f;
      font-size: 11px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <div class="field">
    <label for="mode">Operation</label>

    <select id="mode">
      <option value="damage">
        Damage
      </option>

      <option value="heal">
        Heal
      </option>

      <option value="tempHp">
        Temporary HP
      </option>
    </select>
  </div>

  <div class="field">
    <label for="amount">Amount</label>

    <input
      id="amount"
      type="number"
      min="1"
      step="1"
      value="5"
    />
  </div>

  <div class="field">
    <label for="label">Button Label</label>

    <input
      id="label"
      type="text"
      placeholder="Optional"
    />
  </div>

  <div class="hint">
    Applies to every currently selected token.
    Damage consumes Temporary HP first.
    Healing cannot exceed Maximum HP.
    Temporary HP keeps the higher value.
  </div>

  <script src="index.js"></script>
</body>
</html>
