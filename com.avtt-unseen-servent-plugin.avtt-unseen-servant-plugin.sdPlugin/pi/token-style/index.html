<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Token Style</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      color: #d8d8d8;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .field {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      color: #bdbdbd;
      text-align: right;
    }

    select {
      width: 100%;
      box-sizing: border-box;
      background: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="field">
    <label for="style">Token Style</label>

    <select id="style">
      <option value="circle">Circle</option>
      <option value="square">Square</option>
      <option value="virtualMiniCircle">Virtual Mini w/ Round Base</option>
      <option value="virtualMiniSquare">Virtual Mini w/ Square Base</option>
      <option value="noConstraint">No Constraint</option>
      <option value="definitelyNotAToken">Definitely Not a Token</option>
      <option value="labelToken">Map Pin Token</option>
      <option value="inPersonMini">TV Table Mini – Hidden from Players</option>
    </select>
  </div>

  <script>
    let websocket = null;
    let uuid = null;

    window.connectElgatoStreamDeckSocket = function(
      inPort,
      inUuid,
      inRegisterEvent,
      inInfo,
      inActionInfo
    ) {
      uuid = inUuid;
      websocket = new WebSocket("ws://127.0.0.1:" + inPort);

      websocket.onopen = () => {
        websocket.send(JSON.stringify({
          event: inRegisterEvent,
          uuid
        }));

        const actionInfo = JSON.parse(inActionInfo || "{}");
        const settings = actionInfo.payload?.settings || {};

        document.getElementById("style").value =
          settings.style || "circle";
      };
    };

    document
      .getElementById("style")
      .addEventListener("change", event => {
        if (!websocket || !uuid) return;

        websocket.send(JSON.stringify({
          event: "setSettings",
          context: uuid,
          payload: {
            style: event.target.value
          }
        }));
      });
  </script>
</body>
</html>
