<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Vision</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      color: #d8d8d8;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    .field {
      display: grid;
      grid-template-columns: 120px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    label {
      color: #bdbdbd;
      text-align: right;
    }

    select,
    input {
      width: 100%;
      box-sizing: border-box;
      background: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
    }

    .hint {
      margin-left: 132px;
      color: #8f8f8f;
      font-size: 11px;
      line-height: 1.3;
    }
  </style>
</head>

<body>
  <div class="field">
    <label for="sense">Vision Type</label>

    <select id="sense">
      <option value="vision">Darkvision</option>
      <option value="truesight">Truesight</option>
      <option value="devilsight">Devil's Sight</option>
    </select>
  </div>

  <div class="field">
    <label for="feet">Radius</label>

    <input
      id="feet"
      type="number"
      min="0"
      value="60"
    />
  </div>

  <div class="field">
    <label for="promptForFeet">
      Prompt for Radius
    </label>

    <input
      id="promptForFeet"
      type="checkbox"
    />
  </div>

  <div class="field">
    <label for="color">Color</label>

    <input
      id="color"
      type="text"
      value="rgba(142, 142, 142, 1)"
    />
  </div>

  <div class="field">
    <label for="label">Button Label</label>

    <input
      id="label"
      type="text"
      placeholder="Optional"
    />
  </div>

  <div class="hint">
    Press once to apply this vision type. Press again to remove only this vision type.
  </div>

  <script src="index.js"></script>
</body>
</html>
